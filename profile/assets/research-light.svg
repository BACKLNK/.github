<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-labelledby="t d">
  <title id="t">Who blocks AI crawlers? Backlnk research, 31 October 2026</title>
  <desc id="d">Among 5,996 reachable sites in the Tranco top 10,000: 20.0% block at least one AI training or dataset token, 16.9% block CCBot, 11.3% block at least one AI search crawler, 1.8% block Googlebot.</desc>
  <rect x="0.5" y="0.5" width="1279" height="249" rx="24" fill="#f6f8fd" stroke="#0f1b2d" stroke-opacity="0.08"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="48" y="54" font-size="15" font-weight="700" letter-spacing="2" fill="#2f5bea">ORIGINAL RESEARCH · TRANCO TOP 10,000 · ROBOTS.TXT CHECKED 31 OCT 2026</text>
    <g transform="translate(48 82)">
      <rect width="279" height="128" rx="16" fill="#ffffff" stroke="#0f1b2d" stroke-opacity="0.1"/>
      <text x="24" y="62" font-size="46" font-weight="900" fill="#0f1b2d">20.0%</text>
      <text x="24" y="96" font-size="15" fill="#475467">block at least one AI training</text>
      <text x="24" y="116" font-size="15" fill="#475467">or dataset token</text>
    </g>
    <g transform="translate(347 82)">
      <rect width="279" height="128" rx="16" fill="#ffffff" stroke="#0f1b2d" stroke-opacity="0.1"/>
      <text x="24" y="62" font-size="46" font-weight="900" fill="#0f1b2d">16.9%</text>
      <text x="24" y="96" font-size="15" fill="#475467">block CCBot, the most-blocked</text>
      <text x="24" y="116" font-size="15" fill="#475467">token in the study</text>
    </g>
    <g transform="translate(646 82)">
      <rect width="279" height="128" rx="16" fill="#ffffff" stroke="#0f1b2d" stroke-opacity="0.1"/>
      <text x="24" y="62" font-size="46" font-weight="900" fill="#0f1b2d">11.3%</text>
      <text x="24" y="96" font-size="15" fill="#475467">block at least one AI search</text>
      <text x="24" y="116" font-size="15" fill="#475467">crawler (e.g. OAI-SearchBot)</text>
    </g>
    <g transform="translate(945 82)">
      <rect width="287" height="128" rx="16" fill="#2f5bea"/>
      <text x="24" y="62" font-size="46" font-weight="900" fill="#ffffff">1.8%</text>
      <text x="24" y="96" font-size="15" fill="#e3eaff">block Googlebot from</text>
      <text x="24" y="116" font-size="15" fill="#e3eaff">the whole site</text>
    </g>
    <text x="48" y="236" font-size="13" fill="#667085">Share of 5,996 reachable sites. Dataset: CC BY 4.0 at backlnk.com/research</text>
  </g>
</svg>
