<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Backlnk: technical SEO and AI visibility, with evidence for every finding</title>
  <desc id="d">Free SEO and AI-visibility tools, an MCP server for AI agents, and original AI crawler research at backlnk.com.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#101f3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#2f5bea" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2f5bea" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16243f"/>
      <stop offset="1" stop-color="#121d33"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="64" y="70" width="64" height="64" rx="15" fill="#2f5bea"/>
    <text x="96" y="117" text-anchor="middle" font-size="42" font-weight="900" fill="#ffffff">b</text>
    <text x="148" y="122" font-size="46" font-weight="900" letter-spacing="1" fill="#ffffff">BACKLNK<tspan fill="#5b82ff">.</tspan></text>

    <text x="64" y="196" font-size="34" font-weight="800" fill="#ffffff">Technical SEO &amp; AI visibility,</text>
    <text x="64" y="238" font-size="34" font-weight="800" fill="#8fb0ff">with evidence for every finding.</text>
    <text x="64" y="280" font-size="18" fill="#b6c2d9">Free tools · MCP server for AI agents · Original AI crawler research</text>

    <g font-size="15" font-weight="700">
      <rect x="64" y="310" width="132" height="36" rx="18" fill="#2f5bea" fill-opacity="0.18" stroke="#5b82ff" stroke-opacity="0.6"/>
      <text x="130" y="333" text-anchor="middle" fill="#c9d7ff">15 free tools</text>
      <rect x="208" y="310" width="148" height="36" rx="18" fill="#2f5bea" fill-opacity="0.18" stroke="#5b82ff" stroke-opacity="0.6"/>
      <text x="282" y="333" text-anchor="middle" fill="#c9d7ff">Remote MCP</text>
      <rect x="368" y="310" width="150" height="36" rx="18" fill="#2f5bea" fill-opacity="0.18" stroke="#5b82ff" stroke-opacity="0.6"/>
      <text x="443" y="333" text-anchor="middle" fill="#c9d7ff">backlnk.com</text>
    </g>

    <g transform="translate(760 64)">
      <rect width="456" height="272" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.09"/>
      <circle cx="26" cy="26" r="6" fill="#f04438"/>
      <circle cx="46" cy="26" r="6" fill="#f79009"/>
      <circle cx="66" cy="26" r="6" fill="#12b76a"/>
      <text x="92" y="31" font-size="14" fill="#8a97b0" font-family="Consolas, 'SF Mono', Menlo, monospace">agent ▸ backlnk</text>
      <line x1="0" y1="50" x2="456" y2="50" stroke="#ffffff" stroke-opacity="0.07"/>

      <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15">
        <text x="24" y="82" fill="#8fb0ff">run_checks<tspan fill="#b6c2d9">("https://example.com/")</tspan></text>

        <rect x="24" y="98" width="62" height="24" rx="12" fill="#f04438" fill-opacity="0.16"/>
        <text x="55" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#ff8a80" font-family="'Segoe UI', Arial, sans-serif">Issue</text>
        <text x="98" y="115" fill="#e4e9f2">Missing og:image</text>

        <rect x="24" y="132" width="62" height="24" rx="12" fill="#f79009" fill-opacity="0.16"/>
        <text x="55" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#fdb022" font-family="'Segoe UI', Arial, sans-serif">Review</text>
        <text x="98" y="149" fill="#e4e9f2">Canonical uses a relative URL</text>

        <rect x="24" y="166" width="62" height="24" rx="12" fill="#12b76a" fill-opacity="0.16"/>
        <text x="55" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="#47cd89" font-family="'Segoe UI', Arial, sans-serif">Pass</text>
        <text x="98" y="183" fill="#e4e9f2">OAI-SearchBot may crawl</text>

        <line x1="24" y1="206" x2="432" y2="206" stroke="#ffffff" stroke-opacity="0.07"/>
        <text x="24" y="234" fill="#8fb0ff">verify_fixes<tspan fill="#b6c2d9">(audit_id)</tspan></text>
        <text x="24" y="258" font-size="14" font-family="'Segoe UI', Arial, sans-serif" font-weight="700"><tspan fill="#47cd89">✓ Fixed</tspan><tspan fill="#5d6b85">   ·   </tspan><tspan fill="#ff8a80">New</tspan><tspan fill="#5d6b85">   ·   </tspan><tspan fill="#fdb022">Still open</tspan><tspan fill="#5d6b85">   ·   </tspan><tspan fill="#a3adc2">Not re-checked</tspan></text>
      </g>
    </g>
  </g>
</svg>
